<!DOCTYPE html>
<html lang="ko">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>11월25일 저녁 신청 받기</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #f5f7fb;
        color: #243041;
        font-family: Arial, "Malgun Gothic", sans-serif;
      }
      main {
        width: min(100%, 460px);
        padding: 30px;
        border-radius: 16px;
        background: white;
        box-shadow: 0 10px 32px rgba(22, 38, 65, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 25px; }
      p { margin: 0 0 24px; color: #607086; }
      label { display: block; margin: 18px 0 7px; font-weight: bold; }
      input, textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd3df;
        border-radius: 8px;
        background: #fff;
        color: #243041;
        font: inherit;
      }
      textarea { min-height: 100px; resize: vertical; }
      input:focus, textarea:focus { outline: 2px solid #3269dc; outline-offset: 1px; }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 13px;
        border: 0;
        border-radius: 8px;
        background: #3269dc;
        color: white;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 24px; margin: 14px 0 0; }
      .success { color: #11754c; }
      .error { color: #bf3030; }
    </style>
  </head>
  <body>
    <main>
      <h1>11월25일 저녁 신청 받기</h1>
      <p>원하는 음식과 하고 싶은 말을 적어 주세요.</p>

      <form id="applicationForm">
        <label for="name">이름</label>
        <input id="name" name="name" maxlength="40" required>

        <label for="food">음식</label>
        <input id="food" name="food" maxlength="100" required>

        <label for="message">하고 싶은 말</label>
        <textarea id="message" name="message" maxlength="300" required></textarea>

        <button id="submitButton" type="submit">확인</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById('applicationForm');
      const button = document.getElementById('submitButton');
      const status = document.getElementById('status');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.reportValidity()) return;

        button.disabled = true;
        status.className = '';
        status.textContent = '신청 내용을 저장하고 있습니다...';

        google.script.run
          .withSuccessHandler(function (reply) {
            status.className = 'success';
            status.textContent = reply;
            form.reset();
            button.disabled = false;
          })
          .withFailureHandler(function (error) {
            status.className = 'error';
            status.textContent = '저장에 실패했습니다: ' + error.message;
            button.disabled = false;
          })
          .saveApplication({
            name: form.elements.name.value,
            food: form.elements.food.value,
            message: form.elements.message.value
          });
      });
    </script>
  </body>
</html>
